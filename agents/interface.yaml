interface:
  display_name: "OB Swift Figma"
  short_description: "Implement Figma screens in Swift using existing iOS project architecture"
  default_prompt: "Use $ob-swift-figma to implement this Figma work in the current Swift iOS project, reusing existing components, base classes, pods, and helpers. Treat an OBFigma.md BaseCell section headed # BaseCell or ## BaseCell as shared foundations rather than a page. Require every BaseCell Figma link to show its cell state, back button, and bottom next button; limit implementation to GeneralOBBaseCell, GeneralOBVC.nextButton, Assets.xcassets/GeneralOB/Contents.json namespace metadata, and Assets.xcassets/GeneralOB/icon_back.imageset. Keep unselected cell UI in baseView, selected cell effects in selectedBaseView, export the 44x44 pt back button as 88x88 @2x and 132x132 @3x PNG files resolving as GeneralOB/icon_back, and put shared bottom-button styling directly in GeneralOBVC.nextButton. For a CollectionSection page declaration, use GeneralOBCollectionSectionVC; follow OBSleepVC for registerCell() plus cell(_:path:), and override sectionDetail(sec:) to return the selected section's Figma expansion information."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths:
      - "**/*.swift"
      - "**/*.xcodeproj/**"
      - "**/*.xcworkspace/**"
      - "**/*.xcassets/**"
      - "Podfile"
      - "Package.swift"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
