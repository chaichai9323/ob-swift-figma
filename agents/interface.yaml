interface:
  display_name: "OB Swift Figma"
  short_description: "Implement Figma onboarding screens in GeneralOB UIKit projects"
  default_prompt: "Use $ob-swift-figma in the current project. Follow its lazy reference router, preserve GeneralOB architecture, treat BaseCell as optional, honor OBFigma concurrency and announcements, and verify each page before the single final build."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: ["openai", "claude", "generic", "vscode"]
  activation:
    mode: "manual"
    paths: ["**/*.swift", "**/*.xcodeproj/**", "**/*.xcworkspace/**", "**/*.xcassets/**", "Podfile", "Package.swift"]
  execution: {context: "inline", shell: "bash"}
  trust: {source_tier: "local", remote_inline_execution: "forbid", remote_metadata_policy: "allow-metadata-only"}
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
